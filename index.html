
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PocketSmart AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>💰 PocketSmart AI</h1>
        <p>Smart Budget Planning with AI</p>
    </header>

    <main>
        <section class="planner">
            <h2>Plan Your Budget</h2>

            <label for="category">Choose a Category:</label>
            <select id="category">
                <option value="">-- Select Category --</option>
                <option value="home">Home Interior</option>
                <option value="party">Party Planning</option>
                <option value="jewelry">Jewelry Recommendation</option>
            </select>

            <label for="budget">Enter Your Budget (₹):</label>
            <input type="number" id="budget" placeholder="Enter amount">

            <div id="extraFields"></div>

            <button id="planBtn">Plan My Budget</button>

            <div id="result"></div>
        </section>
    </main>

    <footer>
        <p>© 2026 PocketSmart AI</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
